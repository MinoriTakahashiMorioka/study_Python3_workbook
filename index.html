<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Py3 基礎試験ドリル</title>
  <meta name="description" content="Python3エンジニア認定基礎試験のための学習アプリ（単語・写経・穴埋め・コード読解・お題）">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <!-- コードの色付け：ダーク用とライト用（テーマに合わせて片方だけ有効にする） -->
  <link rel="stylesheet" id="hl-dark" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <link rel="stylesheet" id="hl-light" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-light.min.css" disabled>
  <script>
    // 保存されたテーマを、画面が描かれる前に反映する（ちらつき防止）
    try { var t = localStorage.getItem('py3study.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand"><span class="logo">Py</span><span class="brand-text">基礎試験ドリル</span></a>
    <nav class="nav">
      <a href="#/" data-route="home">ホーム</a>
      <a href="#/vocab" data-route="vocab">単語</a>
      <a href="#/typing" data-route="typing">写経</a>
      <a href="#/fill" data-route="fill">穴埋め</a>
      <a href="#/reading" data-route="reading">読解</a>
      <a href="#/problems" data-route="problems">お題</a>
      <a href="#/workbook" data-route="workbook">問題集</a>
    </nav>
    <button id="theme-btn" class="theme-btn" type="button" title="ダーク／ライト切替" aria-label="ダーク／ライト切替">🌙</button>
    <span id="py-status" class="py-status" data-state="idle" title="ブラウザ内のPython実行エンジン（Pyodide）">Python 未起動</span>
  </header>

  <main id="app"></main>

  <footer class="footer">
    Python3エンジニア認定基礎試験 対策ドリル ・ 問題の追加は <code>data/</code> フォルダのファイルを編集
  </footer>

  <!-- シンタックスハイライト（オフラインでも動作はします） -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <!-- 問題データ（ここを編集すれば問題を増やせます） -->
  <script src="data/vocab.js"></script>
  <script src="data/typing.js"></script>
  <script src="data/fill.js"></script>
  <script src="data/reading.js"></script>
  <script src="data/problems.js"></script>
  <!-- 公式問題集（個人学習用・GitHubには上げない） -->
  <script src="official/workbook.js"></script>

  <!-- アプリ本体 -->
  <script src="js/theme.js"></script>
  <script src="js/app.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/runner.js"></script>
  <script src="js/modes/home.js"></script>
  <script src="js/modes/vocab.js"></script>
  <script src="js/modes/typing.js"></script>
  <script src="js/modes/fill.js"></script>
  <script src="js/modes/reading.js"></script>
  <script src="js/modes/problems.js"></script>
  <script src="js/modes/workbook.js"></script>
</body>
</html>
